name: Publish Website

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🚀 Deploy Website Every Commit
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get Latest Code
      uses: actions/checkout@v3
    
    - name: 📂 Sync Files
      uses: SamKirkland/web-deploy@v1
      with:
        target-server: ssh.laviadelleterme.it
        remote-user: u2-hnksdm9lq7dq
        private-ssh-key: ${{ secrets.SSH_KEY }}
        destination-path: /home/u2-hnksdm9lq7dq/www/staging2.laviadelleterme.it/public_html/
        ssh-port: 18765
        # Escludi tutto cio' che serve solo allo sviluppo: non deve finire nella
        # webroot. In particolare .git/ - actions/checkout lascia il repo completo
        # nella workspace e senza questa exclude finisce dentro public_html,
        # rendendo l'intero sorgente scaricabile da chiunque.
        rsync-options: >-
          --archive --verbose --compress --update
          --exclude=.git/
          --exclude=.github/
          --exclude=.claude/
          --exclude=.gitignore
          --exclude=CLAUDE.md
          --exclude=TEST-TEMA.md
          --exclude=.DS_Store
          --exclude=wp-content/plugins/plugin-custom-skianet/assets/data/
